name: CI

# Prove the installer (a) is shellcheck-clean and (b) actually builds the
# Caelestia/Hyprland stack on a real Ubuntu 24.04 system. The e2e job runs the
# full setup.sh (apt + Qt + wayland + quickshell + m3shapes + caelestia shell +
# configs + verify) and then asserts on its deploy outputs. It does NOT launch
# Hyprland: aquamarine (Hyprland's backend) needs a DRM render node for a GBM
# allocator even in its headless backend, which the GPU-less CI runner cannot
# provide. Validating the built deployment on real hardware is the user's job;
# CI guarantees the installer is reproducible and complete.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Fast, runs on every push/PR: static analysis only.
  # --------------------------------------------------------------------------
  lint:
    name: Shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck -S error setup.sh uninstall.sh update.sh scripts/ci-verify-install.sh

  # --------------------------------------------------------------------------
  # Heavy, real-system test. The runner's `/` is too small for the full build,
  # so the big ephemeral disk is mounted at the workspace and the installer's
  # --------------------------------------------------------------------------
  # Heaviest writes (/opt/qt6, /usr/local, $HOME) are redirected onto it.
  # --------------------------------------------------------------------------
  e2e:
    name: Build + real-system install (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    needs: lint
    steps:
      # MUST run before checkout: this action mounts the runner's large
      # ephemeral disk at GITHUB_WORKSPACE. It does NOT expand `/` itself, so
      # the heavy writes below are redirected onto this mounted disk.
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - uses: actions/checkout@v4

      - name: Redirect heavy writes to the expanded build disk
        # Runs AFTER checkout: the redirect creates a root-owned dir tree under
        # the workspace, which would otherwise make checkout's workspace-cleanup
        # fail with EACCES. `/` only has ~3 GB free after maximize; the big disk
        # is mounted at the workspace path, so point the installer's largest
        # consumers there:
        #   /opt/qt6    (~2 GB Qt download)        -> build-disk/opt-qt
        #   /usr/local  (built binaries install)   -> build-disk/usr-local
        #   $HOME       (source clones + build caches + configs) -> build-disk/home
        # User-facing dirs (home, opt-qt) are chowned to the runner so the
        # non-sudo parts of setup.sh can write there.
        run: |
          set -e
          DISK="${{ github.workspace }}/build-disk"
          sudo mkdir -p "$DISK/opt-qt" "$DISK/usr-local" "$DISK/home"
          sudo cp -a /usr/local/. "$DISK/usr-local/"
          sudo rm -rf /usr/local
          sudo ln -s "$DISK/usr-local" /usr/local
          sudo rm -rf /opt/qt6
          sudo ln -s "$DISK/opt-qt" /opt/qt6
          sudo chown -R "$(id -u):$(id -g)" "$DISK/home" "$DISK/opt-qt"
          echo "HOME=$DISK/home" >> "$GITHUB_ENV"

       - name: Run installer (build everything + deploy configs)
        # --skip-fonts avoids the network font downloads (irrelevant to the
        # build/run test and flaky behind CDNs). Everything else runs for real.
        # --ignore-space skips the 8 GB / check (space lives on the mounted
        # workspace disk instead). Invoked via `bash` to avoid any +x/CRLF issue.
        run: |
          pwd
          ls -la setup.sh
          bash setup.sh --yes --skip-fonts --ignore-space
        working-directory: ${{ github.workspace }}
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Post-install sanity (no display needed)
        # Hyprland can't run headless in a GPU-less CI runner (aquamarine's
        # headless backend needs a GBM render node the runner doesn't expose),
        # so we verify the installer's *outputs* instead: every binary is
        # built & deployed, configs are templated, and the unit's Qt path is real.
        run: bash scripts/ci-verify-install.sh
