# Hyprlock config (valid for hyprlock v0.9.x)
# hyprlock exits immediately if no config file exists, so this ships one.
# __HOME__ is replaced with the real home dir at install time.

general {
    hide_cursor = false
}

auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = true
    }
}

background {
    monitor =
    path = __HOME__/Pictures/wallpapers/wallpaper.jpg
    blur_passes = 2
    blur_size = 3
    contrast = 0.89
    brightness = 0.8
    vibrancy = 0.16
    vibrancy_darkness = 0.0
    color = 0xff0e0e0e
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.5
    dots_center = true
    outer_color = 0xff7aa2f7
    inner_color = 0x1a1a1a
    font_color = 0xffffffff
    fade_on_empty = true
    placeholder_text = Password
    rounding = 12
    position = 0, -200
    halign = center
    valign = center
}

label {
    monitor =
    text = $CLOCK
    color = 0xffffffff
    font_size = 48
    font_family = Rubik
    position = 0, -100
    halign = center
    valign = center
}
