# Hyprland Config for Caelestia Shell
# Built alongside Zorin 18 / Ubuntu 24.04 LTS — does not affect GNOME/Wayland

# --- Environment Variables (Qt 6.11 + Caelestia) ---
# NOTE: no global LD_LIBRARY_PATH on purpose — /usr/local/bin/qs has a baked-in
# RPATH to the Qt toolchain (__QT__), and a session-wide override leaked Qt
# 6.9 libs into every launched app (it even broke Qt builds). Keep it scoped
# to the shell's systemd unit instead. __QT__/__HOME__ are filled in at
# install time by setup.sh.
env = QML_IMPORT_PATH,/usr/local/lib/qt6/qml:/lib/qt6/qml:__QT__/qml
env = PATH,__QT__/bin:__HOME__/.local/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin
env = XDG_CURRENT_DESKTOP,Hyprland:GNOME
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland
env = XCURSOR_SIZE,24

# --- Monitor ---
# Primary panel gets the maintainer's preferred mode; any other monitor
# (e.g. plugged-in display on a machine whose panel isn't eDP-1) falls back
# to its preferred mode automatically.
monitor=eDP-1,1366x768@60,0x0,1
monitor=,preferred,auto,1

# --- Startup ---
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = /usr/bin/foot --server
# Caelestia shell runs as a systemd user service (auto-restarts on crash).
# Import session env into the systemd user manager first so the unit can
# find the Wayland display and Hyprland IPC socket.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE && systemctl --user start caelestia-shell.service
# hyprpaper removed: Caelestia renders its own wallpaper layer (caelestia-background).
# hypridle removed: Caelestia IdleMonitors handles lock/dpms/suspend (shell.json idle.timeouts).

# --- Input ---
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    # Match GNOME: flat (no acceleration), sensitivity 0 == 1.0x multiplier
    accel_profile = flat
    sensitivity = 0
}

# --- Gestures ---
gestures {
    workspace_swipe_invert = false
}

# --- General ---
general {
    border_size = 2
    col.active_border = 0xff7aa2f7
    col.inactive_border = 0xff1e2030
}

# --- Decoration ---
decoration {
    rounding = 10
    active_opacity = 0.95
    inactive_opacity = 0.90
    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
    }
}

# --- Animations ---
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# --- Layouts ---
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# --- Keybindings ---
$mainMod = SUPER

# Applications
bind = $mainMod SHIFT, L, exec, qs -c caelestia ipc call lock lock
bind = $mainMod, N, exec, qs -c caelestia ipc call drawers toggle sidebar
bind = $mainMod, Return, exec, gnome-terminal
bind = $mainMod, D, exec, qs -c caelestia ipc call drawers toggle launcher
bind = $mainMod, E, exec, nautilus
bind = $mainMod, B, exec, flatpak run com.google.Chrome
bind = $mainMod, Q, killactive
bind = $mainMod, M, exec, wlogout
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, SPACE, togglefloating
bind = $mainMod SHIFT, B, exec, flatpak run --command=bazaar io.github.kolunmi.Bazaar

# Make Bazaar center-floating and comfortably sized for a 1366x768 monitor
windowrule = match:class ^(io.github.kolunmi.Bazaar)$, float on
windowrule = match:class ^(io.github.kolunmi.Bazaar)$, size 850 600
windowrule = match:class ^(io.github.kolunmi.Bazaar)$, center on

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window with mainMod + SHIFT
bind = $mainMod SHIFT, 1, moveToWorkspace, 1
bind = $mainMod SHIFT, 2, moveToWorkspace, 2
bind = $mainMod SHIFT, 3, moveToWorkspace, 3
bind = $mainMod SHIFT, 4, moveToWorkspace, 4
bind = $mainMod SHIFT, 5, moveToWorkspace, 5
bind = $mainMod SHIFT, 6, moveToWorkspace, 6
bind = $mainMod SHIFT, 7, moveToWorkspace, 7
bind = $mainMod SHIFT, 8, moveToWorkspace, 8
bind = $mainMod SHIFT, 9, moveToWorkspace, 9
bind = $mainMod SHIFT, 0, moveToWorkspace, 10

# Window movement
bind = $mainMod, H, moveactive, -20 0
bind = $mainMod, L, moveactive, 20 0
bind = $mainMod, K, moveactive, 0 -20
bind = $mainMod, J, moveactive, 0 20

# Window resize
bind = $mainMod, R, submap, resize
submap = resize
    bind = , l, resizeactive, 20 0
    bind = , h, resizeactive, -20 0
    bind = , k, resizeactive, 0 -20
    bind = , j, resizeactive, 0 20
    bind = , escape, submap, reset
submap = reset

# Move/resize with mouse
bindm = $mainMod, mouse:Left, movewindow
bindm = $mainMod, mouse:Right, resizewindow

# --- Screenshot shortcuts (hyprshot) ---
# Uses letter keys since laptop has no Print Screen key
bind = $mainMod SHIFT, S, exec, hyprshot -m region -o ~/Pictures/Screenshots
bind = $mainMod SHIFT, P, exec, hyprshot -m window -o ~/Pictures/Screenshots
bind = $mainMod SHIFT, A, exec, hyprshot -m output -o ~/Pictures/Screenshots

# --- Performance overrides (Haswell / low-end iGPU) ---
# Applied last so it wins over any earlier block. Does not affect GNOME.
source = ~/.config/hypr/perf-overrides.conf
