# Hyprland performance profile for Intel Haswell-ULT (Dell Latitude E5440)
# on the Caelestia + Zorin setup.
#
# Goals:
#   - Keep the existing animation curves and decorations (do NOT remove them).
#   - Reduce wasted fill rate (blur passes, shadows, inactive opacity) so the
#     scene graph does not stall on a 1366x768 panel with an iGPU.
#
# This file is sourced from hyprland.conf. It only contains options that
# are documented for Hyprland 0.56.x and accepted by the official config
# schema linter.

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false
    shadow {
        enabled = false
        range = 0
        render_power = 0
        offset = 0 0
        scale = 0
    }
    blur {
        enabled = true
        size = 2
        passes = 1
        new_optimizations = true
        noise = 0.02
        contrast = 1
        brightness = 1
        popups = false
    }
}
