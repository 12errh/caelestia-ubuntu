[Unit]
# Stop the shell cleanly before the user slice is frozen on suspend.
# The systemd-sleep hook bounces qs on wake and caelestia-relock.sh
# re-acquires the Wayland session lock, so the lock screen is back when
# the lid reopens. Without this the lock holder is frozen away and the
# Wayland session comes back unlocked.
Wants=sleep.target
Before=sleep.target
PartOf=sleep.target

[Service]
# Re-acquire the Caelestia session lock ONLY after a post-resume restart
# (detected via /run/user/1000/caelestia-resume marker touched by the
# system-sleep hook). On a fresh Hyprland login no marker exists, so
# the screen does NOT come up locked.
ExecStartPost=/home/rehan/.local/bin/caelestia-relock.sh 1000
