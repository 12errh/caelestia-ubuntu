[Service]
# Performance tuning for Intel Haswell-ULT on the Hyprland/Caelestia session.
#
# - The Qt RHI "vulkan" backend on Haswell (Gen7.5) hits a Mesa path that
#   is much slower than the OpenGL backend, and several QRhi features
#   fall back to software. Force OpenGL (the default), with the threaded
#   renderer for parallelism.
# - QSG_RENDER_LOOP=threaded moves the scene graph render thread off the
#   GUI thread, which gives a big win on a low-end dual-core.
# - QT_QUICK_BACKEND=software is the *worst* option for Haswell; do not set
#   it. The default (OpenGL via EGL) is the right path here.
# - GL_SAMPLES is not set because Caelestia does its own compositing; MSAA
#   would just cost fill rate for no visual gain on a 1366x768 panel.
#
# These vars only affect Caelestia/Quickshell and have no effect on the
# GNOME session.
Environment=QT_RHI_BACKEND=opengl
Environment=QSG_RENDER_LOOP=threaded
Environment=QT_LOGGING_RULES=qt.qpa.*=false
